<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0C0C0F">
<title>SHRED 20</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230C0C0F' width='100' height='100' rx='20'/><text x='50' y='65' font-size='60' text-anchor='middle'>🔥</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0A0A0D; --cd: #16161A; --cd2: #1C1C22; --bd: #27272A; --bd2: #3F3F46;
    --tx: #FAFAFA; --dim: #A1A1AA; --mu: #71717A;
    --red: #EF4444; --or: #F97316; --gr: #22C55E; --yl: #EAB308; --pu: #A855F7;
    --grad: linear-gradient(135deg, #EF4444 0%, #F97316 50%, #EAB308 100%);
    --grad-soft: linear-gradient(135deg, rgba(239,68,68,0.15), rgba(249,115,22,0.15));
  }
  html, body { overscroll-behavior-y: contain; }
  body {
    background: var(--bg); color: var(--tx); font-family: 'Outfit', system-ui, sans-serif; min-height: 100vh;
    background-image:
      radial-gradient(circle at 10% -10%, rgba(239,68,68,0.10), transparent 40%),
      radial-gradient(circle at 90% 110%, rgba(234,179,8,0.08), transparent 40%);
    background-attachment: fixed;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .wrap { max-width: 500px; margin: 0 auto; padding: 16px 16px 40px; }

  .card {
    background: linear-gradient(180deg, var(--cd2) 0%, var(--cd) 100%);
    border-radius: 18px; padding: 20px; margin-bottom: 14px;
    border: 1px solid var(--bd);
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 24px rgba(0,0,0,0.25);
    animation: rise 0.4s cubic-bezier(0.22,1,0.36,1) both;
  }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

  .label { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--mu); margin-bottom: 8px; text-transform: uppercase; }

  input[type="number"], input[type="text"], input[type="date"] {
    width: 100%; border: 2px solid var(--bd); border-radius: 14px; background: var(--bg);
    color: #fff; font-family: 'JetBrains Mono', monospace; box-sizing: border-box;
    transition: border-color 0.18s, box-shadow 0.18s, transform 0.12s;
  }
  input[type="number"] { padding: 18px; font-size: 28px; font-weight: 700; text-align: center; }
  input[type="text"]   { padding: 14px; font-size: 15px; font-family: 'Outfit', sans-serif; }
  input[type="date"]   { padding: 14px; font-size: 15px; color-scheme: dark; }
  input:focus { outline: none; border-color: var(--or) !important; box-shadow: 0 0 0 4px rgba(249,115,22,0.18); }
  ::placeholder { color: #52525B; }

  button { font-family: 'Outfit', sans-serif; cursor: pointer; transition: transform 0.12s, filter 0.18s, box-shadow 0.18s; border: none; }
  button:active { transform: scale(0.96); }

  .cta {
    width: 100%; padding: 17px; border-radius: 14px; color: #fff; font-weight: 800; font-size: 17px;
    letter-spacing: 1px; background: var(--grad); background-size: 200% 200%; background-position: 0% 50%;
    box-shadow: 0 8px 24px rgba(239,68,68,0.35), 0 1px 0 rgba(255,255,255,0.18) inset;
    transition: background-position 0.4s, transform 0.12s, box-shadow 0.2s;
  }
  .cta:hover { background-position: 100% 50%; box-shadow: 0 10px 30px rgba(249,115,22,0.45), 0 1px 0 rgba(255,255,255,0.18) inset; }

  .progress-shell {
    background: #0F0F12; border-radius: 12px; height: 26px; overflow: hidden; position: relative;
    border: 1px solid var(--bd);
  }
  .progress-fill {
    height: 100%; border-radius: 12px;
    transition: width 0.9s cubic-bezier(0.22,1,0.36,1);
    background: var(--grad); background-size: 200% 100%;
    animation: shimmer 3s linear infinite;
    box-shadow: 0 0 18px rgba(249,115,22,0.45);
  }
  @keyframes shimmer { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
  .progress-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 12px; font-weight: 800; text-shadow: 0 1px 2px rgba(0,0,0,0.5); letter-spacing: 1px; }

  .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .metric-card { padding: 18px; }
  .metric-card .val { font-size: 30px; font-weight: 900; line-height: 1; letter-spacing: -0.5px; }
  .metric-card .unit { font-size: 14px; font-weight: 600; color: var(--dim); margin-left: 4px; }
  .metric-card .sub { font-size: 12px; color: var(--dim); margin-top: 8px; font-weight: 600; }

  .ring { position: relative; width: 64px; height: 64px; }
  .ring svg { transform: rotate(-90deg); }
  .ring .ring-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; }

  .log-entry {
    display: flex; justify-content: space-between; align-items: center; padding: 14px 16px;
    background: var(--cd); border-radius: 14px; margin-bottom: 8px;
    border: 1px solid var(--bd); transition: transform 0.15s, border-color 0.15s;
    animation: rise 0.3s cubic-bezier(0.22,1,0.36,1) both;
  }
  .log-entry:hover { transform: translateX(2px); border-color: var(--bd2); }

  .data-row { display: flex; gap: 8px; margin-top: 12px; }
  .data-row button {
    flex: 1; padding: 12px; border: 1px solid var(--bd); border-radius: 12px;
    background: var(--cd); color: var(--dim); font-size: 12px; font-weight: 700; letter-spacing: 0.5px;
  }
  .data-row button:hover { color: var(--tx); border-color: var(--bd2); }

  .save-flash { text-align: center; padding: 8px; font-size: 12px; font-weight: 600; color: var(--gr); transition: opacity 0.3s; }

  /* Toast */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-150%);
    background: linear-gradient(135deg, var(--yl), var(--or)); color: #1A1A1A;
    padding: 14px 24px; border-radius: 14px; font-weight: 800; font-size: 15px;
    box-shadow: 0 12px 40px rgba(234,179,8,0.4);
    transition: transform 0.45s cubic-bezier(0.34,1.56,0.64,1); z-index: 200;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Confetti burst */
  .burst { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 150; overflow: hidden; }
  .burst span {
    position: absolute; width: 8px; height: 8px; border-radius: 2px; opacity: 0;
    animation: confetti 1.2s ease-out forwards;
  }
  @keyframes confetti {
    0%   { transform: translate(0,0) rotate(0); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) rotate(720deg); opacity: 0; }
  }

  /* Header */
  .hero {
    text-align: center; padding: 18px 0 14px;
  }
  .hero .kicker {
    display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 4px; color: var(--mu);
    padding: 5px 12px; border: 1px solid var(--bd); border-radius: 999px; background: rgba(255,255,255,0.02);
  }
  .hero h1 {
    font-size: 40px; font-weight: 900; margin: 10px 0 4px; letter-spacing: -1px;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 16px rgba(239,68,68,0.25));
  }
  .hero .sub { font-size: 14px; color: var(--dim); font-weight: 600; }

  .pulse-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gr);
    margin-right: 6px; box-shadow: 0 0 0 0 rgba(34,197,94,0.6); animation: pulse 1.8s infinite;
    vertical-align: middle;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(34,197,94,0.6); }
    70%  { box-shadow: 0 0 0 10px rgba(34,197,94,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<input type="file" id="importFile" accept=".json" style="display:none">
<div id="toast" class="toast"></div>

<script>
const CONFIG = {
  totalDays: 20,
  totalDeficit: 21000,
  dailyTarget: 1050,
};

let state = { logs: [] };

// ─── PERSISTENCE ───
const DB_NAME = "shred20", DB_STORE = "data", DB_KEY = "state";
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSave(data) {
  try {
    const db = await openDB();
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).put(data, DB_KEY);
    await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = rej; });
  } catch {}
}
async function idbLoad() {
  try {
    const db = await openDB();
    const tx = db.transaction(DB_STORE, "readonly");
    const req = tx.objectStore(DB_STORE).get(DB_KEY);
    return new Promise(res => { req.onsuccess = () => res(req.result || null); req.onerror = () => res(null); });
  } catch { return null; }
}
async function load() {
  let data = null;
  try { const raw = localStorage.getItem("shred20"); if (raw) data = JSON.parse(raw); } catch {}
  try {
    const idb = await idbLoad();
    if (idb && (!data || (idb.logs?.length || 0) >= (data.logs?.length || 0))) data = idb;
  } catch {}
  if (data) state.logs = data.logs || [];
}
function save() {
  const data = { logs: state.logs };
  let ok = false;
  try { localStorage.setItem("shred20", JSON.stringify(data)); ok = true; } catch {}
  idbSave(data).catch(() => {});
  return ok;
}

function exportData() {
  const blob = new Blob([JSON.stringify({ logs: state.logs, exportedAt: new Date().toISOString() }, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `shred20-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function importData() { document.getElementById("importFile").click(); }
document.getElementById("importFile").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    try {
      const data = JSON.parse(evt.target.result);
      if (!Array.isArray(data.logs)) { alert("Invalid backup."); return; }
      state.logs = data.logs;
      save(); render(); toast("Imported ✅");
    } catch (err) { alert("Import failed: " + err.message); }
  };
  reader.readAsText(file);
  e.target.value = "";
});

// ─── EFFECTS ───
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2200);
}

function burst(intensity = 1) {
  const colors = ["#EF4444", "#F97316", "#EAB308", "#22C55E", "#A855F7"];
  const container = document.createElement("div");
  container.className = "burst";
  const count = 40 * intensity;
  for (let i = 0; i < count; i++) {
    const s = document.createElement("span");
    const angle = Math.random() * Math.PI * 2;
    const dist = 120 + Math.random() * 220 * intensity;
    s.style.setProperty("--tx", Math.cos(angle) * dist + "px");
    s.style.setProperty("--ty", Math.sin(angle) * dist + "px");
    s.style.background = colors[Math.floor(Math.random() * colors.length)];
    s.style.left = "50%";
    s.style.top = "30%";
    s.style.animationDelay = Math.random() * 0.15 + "s";
    container.appendChild(s);
  }
  document.body.appendChild(container);
  setTimeout(() => container.remove(), 1600);
}

function flashSave(ok) {
  const el = document.getElementById("save-status");
  if (!el) return;
  el.textContent = ok ? "✅ Saved" : "❌ Save failed";
  el.style.color = ok ? "var(--gr)" : "var(--red)";
  el.style.opacity = "1";
  setTimeout(() => { el.style.opacity = "0"; }, 1800);
}

// ─── ACTIONS ───
window.doLog = () => {
  const input = document.getElementById("defInput");
  const dateInput = document.getElementById("dateInput");
  const notesInput = document.getElementById("notesInput");
  if (!input) return;
  const value = parseInt(input.value);
  if (isNaN(value)) { input.focus(); return; }

  const date = dateInput ? dateInput.value : new Date().toISOString().slice(0, 10);
  if (state.logs.some(l => l.date === date)) {
    toast("Already logged " + date);
    return;
  }

  const tdBefore = state.logs.reduce((s, l) => s + l.deficit, 0);
  state.logs.push({ deficit: value, date, notes: notesInput ? notesInput.value : "" });
  state.logs.sort((a, b) => a.date.localeCompare(b.date));
  state.logs.forEach((l, i) => l.day = i + 1);
  const td = tdBefore + value;

  const ok = save();
  render();
  flashSave(ok);

  if (td >= CONFIG.totalDeficit && tdBefore < CONFIG.totalDeficit) {
    burst(2.5); toast("🏆 SHREDDED — 21,000 cleared");
  } else if (value >= 1500) {
    burst(1.2); toast("🔥 Beast day · " + value.toLocaleString());
  } else if (value > 0) {
    burst(0.6); toast("Logged · −" + value.toLocaleString());
  } else {
    toast("Logged");
  }
};

window.deleteLog = date => {
  if (!confirm("Delete entry for " + date + "?")) return;
  state.logs = state.logs.filter(l => l.date !== date);
  state.logs.forEach((l, i) => l.day = i + 1);
  save(); render();
};

window.doReset = () => {
  if (confirm("Reset ALL data? This cannot be undone.")) {
    state.logs = [];
    localStorage.removeItem("shred20");
    idbSave({ logs: [] });
    render();
    toast("Reset");
  }
};

window.exportData = exportData;
window.importData = importData;

// ─── RENDER ───
function ringSVG(pct, color = "#F97316") {
  const r = 26, c = 2 * Math.PI * r;
  const off = c * (1 - Math.min(1, pct / 100));
  return `<svg width="64" height="64">
    <circle cx="32" cy="32" r="${r}" stroke="#27272A" stroke-width="6" fill="none"/>
    <circle cx="32" cy="32" r="${r}" stroke="${color}" stroke-width="6" fill="none"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      style="transition: stroke-dashoffset 0.9s cubic-bezier(0.22,1,0.36,1)"/>
  </svg>`;
}

function render() {
  const td = state.logs.reduce((s, l) => s + l.deficit, 0);
  const daysLogged = state.logs.length;
  const daysLeft = Math.max(0, CONFIG.totalDays - daysLogged);
  const pct = (td / CONFIG.totalDeficit) * 100;
  const pctClamped = Math.min(100, Math.max(0, pct));
  const overshoot = Math.max(0, pct - 100);
  const remaining = Math.max(0, CONFIG.totalDeficit - td);
  const dailyNeeded = daysLeft > 0 ? Math.round(remaining / daysLeft) : 0;
  const expected = daysLogged * CONFIG.dailyTarget;
  const diff = td - expected;
  const ahead = diff >= 0;
  const dayPct = (daysLogged / CONFIG.totalDays) * 100;
  const lbsLost = (td / 3500).toFixed(1);
  const avgPerDay = daysLogged > 0 ? td / daysLogged : 0;
  const projectedTotal = Math.round(avgPerDay * CONFIG.totalDays);
  const projectedLbs = (projectedTotal / 3500).toFixed(1);

  const app = document.getElementById("app");
  let h = "";

  // Hero
  h += `<div class="hero">
    <div class="kicker"><span class="pulse-dot"></span>20 DAY CHALLENGE</div>
    <h1>SHRED 20</h1>
    <div class="sub">21,000 cal deficit · ~${CONFIG.dailyTarget}/day</div>
  </div>`;

  // Progress card
  h += `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
      <span class="label" style="margin-bottom:0">Total Deficit</span>
      <span class="mono" style="font-size:13px;color:var(--dim)">${td.toLocaleString()} / ${CONFIG.totalDeficit.toLocaleString()}</span>
    </div>
    <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:12px">
      <span class="mono" style="font-size:32px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-1px">${lbsLost}</span>
      <span style="font-size:13px;color:var(--dim);font-weight:600">lbs lost (est.)</span>
      ${overshoot > 0 ? `<span style="margin-left:auto;font-size:11px;font-weight:800;color:var(--yl);letter-spacing:1px">+${overshoot.toFixed(0)}% STRETCH</span>` : ""}
    </div>
    <div class="progress-shell">
      <div class="progress-fill" style="width:${pctClamped}%"></div>
      <div class="progress-text mono">${pct.toFixed(1)}%</div>
    </div>
  </div>`;

  // Metrics
  const aheadColor = ahead ? "var(--gr)" : "var(--red)";
  h += `<div class="metric-grid">
    <div class="card metric-card" style="display:flex;align-items:center;gap:14px">
      <div class="ring">${ringSVG(dayPct, "#EAB308")}<div class="ring-text mono">${daysLogged}/${CONFIG.totalDays}</div></div>
      <div>
        <div class="label" style="margin-bottom:4px">Days</div>
        <div style="font-size:18px;font-weight:800">${daysLeft} <span style="font-size:13px;color:var(--dim);font-weight:600">left</span></div>
      </div>
    </div>
    <div class="card metric-card">
      <div class="label">Daily Target</div>
      <div class="val mono">${dailyNeeded}<span class="unit">cal</span></div>
      <div class="sub" style="color:${aheadColor}">${ahead ? '▲' : '▼'} ${Math.abs(diff).toLocaleString()} ${ahead ? 'ahead' : 'behind'}</div>
    </div>
  </div>`;

  // Projection
  if (daysLogged > 0 && daysLeft > 0) {
    h += `<div class="card" style="padding:16px 20px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg, rgba(168,85,247,0.06), var(--cd))">
      <div>
        <div class="label" style="margin-bottom:4px">At Current Pace</div>
        <div style="font-size:13px;color:var(--dim);font-weight:600">avg ${Math.round(avgPerDay).toLocaleString()} cal/day · projected day 20</div>
      </div>
      <div style="text-align:right">
        <div class="mono" style="font-size:22px;font-weight:900;color:#fff">${projectedTotal.toLocaleString()}</div>
        <div style="font-size:12px;color:var(--pu);font-weight:700">~${projectedLbs} lbs</div>
      </div>
    </div>`;
  }

  // Log form
  const today = new Date().toISOString().slice(0, 10);
  const nextDay = Math.min(daysLogged + 1, CONFIG.totalDays);
  h += `<div class="card" style="padding:24px;background:linear-gradient(180deg, rgba(239,68,68,0.06) 0%, var(--cd) 60%);border-color:#3a2326">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
      <div style="font-size:13px;font-weight:800;letter-spacing:3px;color:var(--or)">LOG DAY ${nextDay}</div>
      <div style="font-size:11px;color:var(--mu);font-weight:700;letter-spacing:1px">${today}</div>
    </div>
    <div style="margin-bottom:14px">
      <div class="label">Net Deficit (cal)</div>
      <input type="number" id="defInput" placeholder="e.g. ${CONFIG.dailyTarget}" autofocus>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
      <div>
        <div class="label">Date</div>
        <input type="date" id="dateInput" value="${today}">
      </div>
      <div>
        <div class="label">Notes</div>
        <input type="text" id="notesInput" placeholder="optional">
      </div>
    </div>
    <button class="cta" onclick="doLog()">LOG IT 🔥</button>
  </div>`;

  // Log list
  if (state.logs.length > 0) {
    h += `<div style="display:flex;justify-content:space-between;align-items:center;margin:18px 4px 10px">
      <div class="label" style="margin-bottom:0">📋 Entries (${state.logs.length})</div>
      <div class="mono" style="font-size:11px;color:var(--mu)">avg ${Math.round(td / state.logs.length).toLocaleString()}/day</div>
    </div>`;
    state.logs.slice().reverse().forEach(l => {
      const positive = l.deficit >= 0;
      const borderColor = !positive ? "var(--red)" : l.deficit >= 1500 ? "var(--gr)" : l.deficit >= 1050 ? "var(--or)" : "var(--yl)";
      const sign = positive ? "−" : "+";
      const valColor = positive ? (l.deficit >= 1500 ? "var(--gr)" : "var(--or)") : "var(--red)";
      h += `<div class="log-entry" style="border-left:4px solid ${borderColor}">
        <div style="flex:1;min-width:0">
          <div><span style="font-weight:800;font-size:15px">Day ${l.day}</span><span class="mono" style="font-size:12px;margin-left:8px;color:var(--mu)">${l.date}</span></div>
          ${l.notes ? `<div style="font-size:12px;color:var(--mu);margin-top:4px">${l.notes}</div>` : ""}
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="mono" style="font-weight:800;font-size:18px;color:${valColor}">${sign} ${Math.abs(l.deficit).toLocaleString()}</div>
          <button onclick="deleteLog('${l.date}')" style="background:transparent;border:1px solid var(--bd);border-radius:8px;color:var(--mu);font-size:12px;padding:4px 8px">✕</button>
        </div>
      </div>`;
    });
  } else {
    h += `<div class="card" style="text-align:center;padding:32px 20px;border:2px dashed var(--bd);background:transparent">
      <div style="font-size:40px;margin-bottom:8px">🎯</div>
      <div style="font-size:16px;font-weight:800;margin-bottom:6px">Day 1 awaits</div>
      <div style="font-size:13px;color:var(--dim);line-height:1.6">Log your first deficit above. ~${CONFIG.dailyTarget} cal/day for 20 days = SHREDDED.</div>
    </div>`;
  }

  // Done
  if (td >= CONFIG.totalDeficit) {
    h += `<div class="card" style="text-align:center;padding:32px;border:2px solid var(--yl);background:linear-gradient(135deg, rgba(234,179,8,0.10), rgba(249,115,22,0.10))">
      <div style="font-size:54px">🏆</div>
      <div style="font-size:24px;font-weight:900;color:var(--yl);margin-top:8px;letter-spacing:1px">SHREDDED.</div>
      <div style="font-size:14px;color:var(--dim);margin-top:6px">21,000 cal deficit cleared. You did it.</div>
    </div>`;
  }

  // Data
  h += `<div class="card">
    <div class="label">💾 Data</div>
    <div class="data-row">
      <button onclick="exportData()">📥 Export</button>
      <button onclick="importData()">📤 Import</button>
    </div>
    <div style="margin-top:10px">
      <button onclick="doReset()" style="width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:transparent;color:var(--mu);font-size:12px;font-weight:700;letter-spacing:1px">🗑️ RESET ALL</button>
    </div>
  </div>`;

  h += `<div id="save-status" class="save-flash" style="opacity:0">​</div>`;
  h += `<div style="text-align:center;padding:8px 0;font-size:10px;color:#3a3a40;font-weight:700;letter-spacing:3px">SHRED 20 · v1</div>`;

  app.innerHTML = h;
}

(async () => { await load(); render(); })();
</script>
</body>
</html>
