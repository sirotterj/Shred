<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F5F4ED">
<title>Shred 20</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #F5F4ED;
    --card: #FFFFFF;
    --card2: #FAF9F4;
    --tx: #1F1F1E;
    --tx2: #2C2C2A;
    --dim: #6B6B68;
    --mu: #9A9A95;
    --bd: #E8E5DC;
    --bd2: #D9D5C8;
    --accent: #C96442;
    --accent2: #D97757;
    --accent-soft: #F4E5DC;
    --green: #5A8A3A;
    --green-soft: #E5EFD8;
    --gold: #B5882B;
    --rose: #B8466B;
    --blue: #4A6FA5;
    --purple: #7B5BA8;
  }
  html, body { overscroll-behavior-y: contain; }
  body {
    background: var(--bg); color: var(--tx);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100vh; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 20px 18px 40px; }

  .card {
    background: var(--card); border-radius: 14px; padding: 20px; margin-bottom: 12px;
    border: 1px solid var(--bd);
    animation: rise 0.45s cubic-bezier(0.22,1,0.36,1) both;
  }
  @keyframes rise { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }

  .label { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; color: var(--mu); margin-bottom: 8px; text-transform: uppercase; }

  input[type="number"], input[type="text"], input[type="date"] {
    width: 100%; border: 1px solid var(--bd); border-radius: 10px; background: var(--bg);
    color: var(--tx); font-family: 'JetBrains Mono', monospace; box-sizing: border-box;
    transition: border-color 0.18s, box-shadow 0.18s;
  }
  input[type="number"] { padding: 16px; font-size: 26px; font-weight: 700; text-align: center; }
  input[type="text"]   { padding: 12px 14px; font-size: 15px; font-family: 'Inter', sans-serif; }
  input[type="date"]   { padding: 12px 14px; font-size: 15px; font-family: 'Inter', sans-serif; }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(201,100,66,0.15); }
  ::placeholder { color: var(--mu); }

  button { font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.15s; border: none; }
  button:active { transform: scale(0.97); }

  .cta {
    width: 100%; padding: 15px; border-radius: 12px; color: #fff; font-weight: 600; font-size: 16px;
    background: var(--accent);
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .cta:hover { background: var(--accent2); box-shadow: 0 2px 8px rgba(201,100,66,0.25); }

  .progress-shell {
    background: var(--bg); border-radius: 999px; height: 10px; overflow: hidden; position: relative;
    border: 1px solid var(--bd);
  }
  .progress-fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 1s cubic-bezier(0.22,1,0.36,1);
  }

  .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }

  .ring { position: relative; width: 56px; height: 56px; flex-shrink: 0; }
  .ring svg { transform: rotate(-90deg); }
  .ring-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--tx); }

  .log-entry {
    display: flex; justify-content: space-between; align-items: center; padding: 12px 14px;
    background: var(--card); border-radius: 12px; margin-bottom: 6px;
    border: 1px solid var(--bd); transition: all 0.15s;
    animation: rise 0.3s cubic-bezier(0.22,1,0.36,1) both;
  }
  .log-entry:hover { border-color: var(--bd2); transform: translateX(2px); }

  .data-row { display: flex; gap: 8px; }
  .data-row button {
    flex: 1; padding: 10px; border: 1px solid var(--bd); border-radius: 10px;
    background: var(--card); color: var(--dim); font-size: 12px; font-weight: 600;
  }
  .data-row button:hover { color: var(--tx); border-color: var(--bd2); background: var(--bg); }

  .save-flash { text-align: center; padding: 6px; font-size: 11px; font-weight: 600; color: var(--green); transition: opacity 0.3s; }

  /* Toast */
  .toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-150%);
    background: var(--tx); color: var(--bg);
    padding: 12px 20px; border-radius: 999px; font-weight: 600; font-size: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1); z-index: 200;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Surprise FX layer */
  .fx { position: fixed; inset: 0; pointer-events: none; z-index: 150; overflow: hidden; }
  .fx-flash { position: fixed; inset: 0; pointer-events: none; z-index: 140; opacity: 0; animation: flashAnim 0.6s ease-out forwards; }
  @keyframes flashAnim { 0% { opacity: 0.5; } 100% { opacity: 0; } }

  .fx span {
    position: absolute; display: block; will-change: transform, opacity;
  }

  /* Hero */
  .hero { text-align: center; padding: 16px 0 14px; }
  .hero .kicker {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600; letter-spacing: 2px; color: var(--dim);
    padding: 4px 12px; border: 1px solid var(--bd); border-radius: 999px; background: var(--card);
    text-transform: uppercase;
  }
  .hero h1 {
    font-size: 36px; font-weight: 800; margin: 12px 0 4px; letter-spacing: -1px; color: var(--tx);
  }
  .hero .accent-text { color: var(--accent); }
  .hero .sub { font-size: 14px; color: var(--dim); font-weight: 500; }

  .pulse-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 0 rgba(201,100,66,0.5); animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(201,100,66,0.4); }
    70%  { box-shadow: 0 0 0 8px rgba(201,100,66,0); }
    100% { box-shadow: 0 0 0 0 rgba(201,100,66,0); }
  }

  .lbs-headline {
    font-family: 'Inter', sans-serif; font-size: 44px; font-weight: 800; letter-spacing: -1.5px;
    color: var(--tx); line-height: 1;
  }

  /* All 20 surprise keyframes */
  @keyframes burstOut { to { transform: translate(var(--tx-d), var(--ty-d)) rotate(var(--rot)); opacity: 0; } }
  @keyframes floatUp { 0% { transform: translateY(20px); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-110vh) rotate(var(--rot,0deg)); opacity: 0; } }
  @keyframes fall { 0% { transform: translateY(-10vh) rotate(0); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
  @keyframes shootDiag { 0% { transform: translate(-10vw, -10vh) scale(0.4); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(110vw, 110vh) scale(1); opacity: 0; } }
  @keyframes pop { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.8); opacity: 0; } }
  @keyframes ripple { 0% { transform: scale(0); opacity: 0.7; } 100% { transform: scale(20); opacity: 0; } }
  @keyframes sparkle { 0% { transform: scale(0) rotate(0); opacity: 0; } 50% { transform: scale(1) rotate(180deg); opacity: 1; } 100% { transform: scale(0) rotate(360deg); opacity: 0; } }
  @keyframes spinFly { 0% { transform: scale(0.4) rotate(0); opacity: 0; } 30% { transform: scale(1.5) rotate(360deg); opacity: 1; } 100% { transform: scale(2.5) rotate(720deg); opacity: 0; } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
  @keyframes bannerSlide { 0% { transform: translate(-100vw, 0) skewX(-10deg); opacity: 0; } 30%,70% { transform: translate(0,0) skewX(-10deg); opacity: 1; } 100% { transform: translate(110vw, 0) skewX(-10deg); opacity: 0; } }
  @keyframes rocketUp { 0% { transform: translateY(20px) scale(1); opacity: 1; } 100% { transform: translateY(-120vh) scale(1.3); opacity: 0; } }
  @keyframes rainbowSweep { 0% { transform: translateX(-110%); } 100% { transform: translateX(110%); } }
  @keyframes glowPulse { 0% { transform: scale(0); opacity: 0.6; } 100% { transform: scale(8); opacity: 0; } }
  @keyframes balloonRise { 0% { transform: translateY(20px); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateY(-110vh) translateX(var(--sway, 0)); opacity: 0; } }
  @keyframes shakeScreen { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px) translateY(2px); } 50% { transform: translateX(4px) translateY(-2px); } 75% { transform: translateX(-2px) translateY(4px); } }
  @keyframes pixelTwinkle { 0%,100% { opacity: 0; transform: scale(0.5); } 50% { opacity: 1; transform: scale(1); } }
  @keyframes bounce { 0% { transform: translateY(-100vh) scale(0.5); } 60% { transform: translateY(0) scale(1.1); } 80% { transform: translateY(-30px) scale(1); } 100% { transform: translateY(0) scale(1); opacity: 0; } }
  @keyframes orbitSpin { 0% { transform: rotate(0) translateX(var(--orbit, 80px)) rotate(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: rotate(720deg) translateX(var(--orbit, 80px)) rotate(-720deg); opacity: 0; } }

  .shaking { animation: shakeScreen 0.5s ease-in-out; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<input type="file" id="importFile" accept=".json" style="display:none">
<div id="toast" class="toast"></div>

<script>
const CONFIG = {
  totalDays: 20,
  totalDeficit: 21000,
  dailyTarget: 1050,
};

let state = { logs: [] };

// ─── PERSISTENCE ───
const DB_NAME = "shred20", DB_STORE = "data", DB_KEY = "state";
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSave(data) {
  try {
    const db = await openDB();
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).put(data, DB_KEY);
    await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = rej; });
  } catch {}
}
async function idbLoad() {
  try {
    const db = await openDB();
    const tx = db.transaction(DB_STORE, "readonly");
    const req = tx.objectStore(DB_STORE).get(DB_KEY);
    return new Promise(res => { req.onsuccess = () => res(req.result || null); req.onerror = () => res(null); });
  } catch { return null; }
}
async function load() {
  let data = null;
  try { const raw = localStorage.getItem("shred20"); if (raw) data = JSON.parse(raw); } catch {}
  try {
    const idb = await idbLoad();
    if (idb && (!data || (idb.logs?.length || 0) >= (data.logs?.length || 0))) data = idb;
  } catch {}
  if (data) state.logs = data.logs || [];
}
function save() {
  const data = { logs: state.logs };
  let ok = false;
  try { localStorage.setItem("shred20", JSON.stringify(data)); ok = true; } catch {}
  idbSave(data).catch(() => {});
  return ok;
}

function exportData() {
  const blob = new Blob([JSON.stringify({ logs: state.logs, exportedAt: new Date().toISOString() }, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `shred20-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function importData() { document.getElementById("importFile").click(); }
document.getElementById("importFile").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    try {
      const data = JSON.parse(evt.target.result);
      if (!Array.isArray(data.logs)) { alert("Invalid backup."); return; }
      state.logs = data.logs;
      save(); render(); toast("Imported");
    } catch (err) { alert("Import failed: " + err.message); }
  };
  reader.readAsText(file);
  e.target.value = "";
});

// ─── EFFECTS ───
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2400);
}

const PALETTE = ["#C96442", "#D97757", "#B5882B", "#5A8A3A", "#4A6FA5", "#7B5BA8", "#B8466B"];
const GOLD = ["#F4C430", "#FFD700", "#E6B325", "#FFC857"];
const FIRE = ["#FF3B30", "#FF6B1A", "#FF9500", "#FFCC00"];

// ─── CANVAS FX ENGINE ───
const FX = (() => {
  let canvas, ctx, W = 0, H = 0, DPR = 1;
  let particles = [];
  let running = false;
  let lastT = 0, endT = 0;

  function ensure() {
    if (canvas) return;
    canvas = document.createElement("canvas");
    canvas.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:160";
    document.body.appendChild(canvas);
    resize();
    window.addEventListener("resize", resize);
  }
  function resize() {
    if (!canvas) return;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx = canvas.getContext("2d");
    ctx.scale(DPR, DPR);
  }
  function spawn(p) {
    p.life = p.life ?? 1; p.maxLife = p.life;
    p.vx = p.vx ?? 0; p.vy = p.vy ?? 0;
    p.ax = p.ax ?? 0; p.ay = p.ay ?? 0;
    p.gravity = p.gravity ?? 0; p.drag = p.drag ?? 0;
    p.rot = p.rot ?? 0; p.vrot = p.vrot ?? 0;
    p.size = p.size ?? 4; p.color = p.color ?? "#C96442";
    p.shape = p.shape ?? "circle";
    p.alpha = p.alpha ?? 1;
    p.composite = p.composite ?? "lighter";
    if (p.trail) p.trailPts = [];
    particles.push(p);
  }
  function drawStar(r, points = 5) {
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const ang = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
      const rr = i % 2 === 0 ? r : r * 0.42;
      const x = Math.cos(ang) * rr, y = Math.sin(ang) * rr;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.fill();
  }
  function drawParticle(p) {
    const a = Math.max(0, p.life / p.maxLife);
    ctx.globalCompositeOperation = p.composite;
    if (p.trail && p.trailPts.length > 1) {
      ctx.strokeStyle = p.color;
      ctx.globalAlpha = a * 0.45;
      ctx.lineWidth = p.size * 0.7;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(p.trailPts[0].x, p.trailPts[0].y);
      for (let i = 1; i < p.trailPts.length; i++) ctx.lineTo(p.trailPts[i].x, p.trailPts[i].y);
      ctx.stroke();
    }
    ctx.globalAlpha = a * p.alpha;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    if (p.shape === "circle") {
      ctx.beginPath(); ctx.arc(0, 0, p.size, 0, Math.PI * 2); ctx.fill();
    } else if (p.shape === "rect") {
      ctx.fillRect(-p.size / 2, -p.size * 0.7, p.size, p.size * 1.4);
    } else if (p.shape === "star") {
      drawStar(p.size, p.points || 5);
    } else if (p.shape === "spark") {
      const speed = Math.hypot(p.vx, p.vy) || 1;
      const len = Math.min(p.size * 5, speed * 0.04 + 6);
      ctx.rotate(Math.atan2(p.vy, p.vx) - p.rot);
      ctx.fillRect(-len / 2, -p.size / 2, len, p.size);
    } else if (p.shape === "ring") {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = p.lineW || 2;
      ctx.beginPath(); ctx.arc(0, 0, p.size, 0, Math.PI * 2); ctx.stroke();
    } else if (p.shape === "flame") {
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, p.size);
      g.addColorStop(0, p.color);
      g.addColorStop(0.55, p.color2 || p.color);
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, p.size, 0, Math.PI * 2); ctx.fill();
    } else if (p.shape === "text") {
      ctx.font = `${p.weight || 700} ${p.size}px Inter, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      if (p.stroke) {
        ctx.strokeStyle = p.stroke;
        ctx.lineWidth = p.strokeW || 3;
        ctx.strokeText(p.text, 0, 0);
      }
      ctx.fillText(p.text, 0, 0);
    } else if (p.shape === "petal") {
      ctx.beginPath();
      ctx.ellipse(0, -p.size, p.size * 0.5, p.size, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }
  function tick(t) {
    if (!lastT) lastT = t;
    const dt = Math.min(0.04, (t - lastT) / 1000);
    lastT = t;
    ctx.clearRect(0, 0, W, H);
    particles = particles.filter(p => {
      p.life -= dt;
      if (p.life <= 0) return false;
      if (p.update) p.update(p, dt, t);
      p.vx += p.ax * dt;
      p.vy += (p.ay + p.gravity) * dt;
      const dragF = Math.pow(1 - p.drag, dt * 60);
      p.vx *= dragF; p.vy *= dragF;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vrot * dt;
      if (p.trail) {
        p.trailPts.unshift({ x: p.x, y: p.y });
        if (p.trailPts.length > (p.trailMax || 8)) p.trailPts.pop();
      }
      drawParticle(p);
      return true;
    });
    if (particles.length || t < endT) requestAnimationFrame(tick);
    else running = false;
  }
  function start(durationMs = 1500) {
    ensure();
    endT = performance.now() + durationMs;
    if (!running) { running = true; lastT = 0; requestAnimationFrame(tick); }
  }
  return { spawn, start, ensure, get W() { return W; }, get H() { return H; } };
})();

function flash(color = "rgba(255,255,255,0.7)", duration = 450) {
  const el = document.createElement("div");
  el.style.cssText = `position:fixed;inset:0;background:${color};pointer-events:none;z-index:155;opacity:1;transition:opacity ${duration}ms ease-out`;
  document.body.appendChild(el);
  requestAnimationFrame(() => { el.style.opacity = "0"; });
  setTimeout(() => el.remove(), duration + 100);
}

function shake(intensity = 8, duration = 500) {
  const target = document.getElementById("app");
  const t0 = performance.now();
  function step(t) {
    const e = (t - t0) / duration;
    if (e >= 1) { target.style.transform = ""; return; }
    const decay = (1 - e) * (1 - e);
    const x = (Math.random() - 0.5) * 2 * intensity * decay;
    const y = (Math.random() - 0.5) * 2 * intensity * decay;
    target.style.transform = `translate(${x}px, ${y}px)`;
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function domLayer(durationMs = 2500) {
  const c = document.createElement("div");
  c.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:170;overflow:hidden";
  document.body.appendChild(c);
  setTimeout(() => c.remove(), durationMs + 200);
  return c;
}

// Procedural fractal lightning bolt
function lightningBolt(x1, y1, x2, y2, displace, ctx, segs) {
  if (displace < 4) {
    segs.push([x1, y1, x2, y2]);
    return;
  }
  const mx = (x1 + x2) / 2 + (Math.random() - 0.5) * displace;
  const my = (y1 + y2) / 2 + (Math.random() - 0.5) * displace;
  lightningBolt(x1, y1, mx, my, displace / 2, ctx, segs);
  lightningBolt(mx, my, x2, y2, displace / 2, ctx, segs);
  if (Math.random() < 0.35 && displace > 16) {
    const bx = mx + (Math.random() - 0.5) * displace * 1.2;
    const by = my + Math.random() * displace * 0.8;
    lightningBolt(mx, my, bx, by, displace / 3, ctx, segs);
  }
}

// Multi-stage firework helper
function firework(x, y, opts = {}) {
  const colors = opts.colors || PALETTE;
  const n = opts.n || 70;
  // initial flash
  FX.spawn({ x, y, life: 0.35, size: 50, color: "rgba(255,255,255,0.9)", shape: "circle", composite: "lighter" });
  FX.spawn({ x, y, life: 0.6, size: 90, color: colors[0], shape: "circle", composite: "lighter", alpha: 0.4 });
  // peony ring
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random() * 0.05;
    const sp = 220 + Math.random() * 200;
    FX.spawn({
      x, y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      gravity: 320, drag: 0.025,
      life: 1.4 + Math.random() * 0.6,
      size: 2.5 + Math.random() * 1.5,
      color: colors[i % colors.length],
      shape: "circle", trail: true, trailMax: 7,
    });
  }

            x, y, life: 1.0, size: 4,
            color: "#FFE66D", shape: "circle",
            trail: true, trailMax: 14,
          });
          // sparkles
          if (Math.random() < 0.4) {
            FX.spawn({
              x: x + (Math.random() - 0.5) * 20, y: y + (Math.random() - 0.5) * 20,
              vx: (Math.random() - 0.5) * 100, vy: (Math.random() - 0.5) * 100,
              life: 0.6, size: 2 + Math.random() * 2,
              color: "#FFFFFF", shape: "star", points: 4, vrot: 8,
            });
          }
          if (e < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }, i * 220);
    }
  },

  // 16: PIXEL RAIN — Matrix-style columns of falling color pixels
  () => {
    FX.start(3000);
    const W = FX.W, H = FX.H;
    const cols = 30;
    for (let c = 0; c < cols; c++) {
      const x = (c / cols) * W + (W / cols) * 0.5;
      const startDelay = Math.random() * 500;
      const colColors = [PALETTE[c % PALETTE.length], "#FFFFFF"];
      for (let i = 0; i < 25; i++) {
        setTimeout(() => {
          FX.spawn({
            x, y: -10,
            vy: 250 + Math.random() * 150,
            life: 2.2,
            size: 8, color: i === 0 ? "#FFFFFF" : colColors[0],
            shape: "rect",
            alpha: i === 0 ? 1 : 0.7 - i * 0.025,
            composite: "source-over",
          });
        }, startDelay + i * 50);
      }
    }
  },

  // 17: STAR PULSE — concentric mandala pulses outward, big star at center
  () => {
    FX.start(3500);
    const W = FX.W, H = FX.H;
    const cx = W / 2, cy = H * 0.4;
    // glow pulses
    for (let i = 0; i < 5; i++) {
      setTimeout(() => {
        FX.spawn({
          x: cx, y: cy, life: 1.6, size: 20,
          color: ["#FFE66D", "#C96442", "#FFD700", "#D97757", "#FFA94D"][i],
          shape: "ring", lineW: 5,
          update: (p, dt) => {
            p.size += 300 * dt;
            p.alpha = (p.life / p.maxLife) * 0.8;
          },
        });
      }, i * 180);
    }
    // mandala stars rotating
    for (let i = 0; i < 8; i++) {
      const a0 = (i / 8) * Math.PI * 2;
      FX.spawn({
        x: cx, y: cy, life: 2.5, size: 18,
        color: GOLD[i % GOLD.length], shape: "star", points: 6, vrot: 3,
        update: (p, dt) => {
          const e = (p.maxLife - p.life) / p.maxLife;
          const r = e * 250;
          p.x = cx + Math.cos(a0 + e * 4) * r;
          p.y = cy + Math.sin(a0 + e * 4) * r;
          p.alpha = 1 - e;
        },
      });
    }
    // center burst star
    FX.spawn({
      x: cx, y: cy, life: 2.5, size: 0,
      color: "#FFE66D", shape: "star", points: 6, vrot: 1,
      update: (p, dt) => {
        const e = (p.maxLife - p.life) / p.maxLife;
        p.size = Math.sin(e * Math.PI) * 70;
      },
    });
  },

  // 18: BALLOONS — strings, sway, some pop into mini confetti
  () => {
    FX.start(4500);
    const W = FX.W, H = FX.H;
    const dom = domLayer(4500);
    const balloonColors = ["#FF6B9D", "#FFD93D", "#6BCB77", "#4D96FF", "#C96442"];
    for (let i = 0; i < 14; i++) {
      setTimeout(() => {
        const x0 = Math.random() * W;
        const color = balloonColors[i % balloonColors.length];
        const b = document.createElement("div");
        b.style.cssText = `position:absolute;left:${x0}px;bottom:-100px;width:50px;height:64px;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.6), ${color} 50%, ${color});filter:drop-shadow(0 4px 8px rgba(0,0,0,0.15));transition:bottom 4s linear, transform 4s ease-in-out`;
        b.innerHTML = `<div style="position:absolute;top:100%;left:50%;width:2px;height:50px;background:rgba(0,0,0,0.3);transform:translateX(-50%)"></div>`;
        dom.appendChild(b);
        const sway = (Math.random() - 0.5) * 100;
        requestAnimationFrame(() => {
          b.style.bottom = (H + 100) + "px";
          b.style.transform = `translateX(${sway}px) rotate(${sway * 0.1}deg)`;
        });
        // some pop midway
        if (Math.random() < 0.4) {
          setTimeout(() => {
            const rect = b.getBoundingClientRect();
            const px = rect.left + rect.width / 2, py = rect.top + rect.height / 2;
            b.style.opacity = "0";
            for (let k = 0; k < 20; k++) {
              const a = Math.random() * Math.PI * 2;
              const sp = 100 + Math.random() * 200;
              FX.spawn({
                x: px, y: py,
                vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                gravity: 400, drag: 0.03, life: 1.2,
                size: 5, color, shape: "rect",
                vrot: (Math.random() - 0.5) * 12,
                composite: "source-over",
              });
            }
          }, 1500 + Math.random() * 1500);
        }
      }, i * 200);
    }
  },

  // 19: AURORA — flowing rainbow ribbon + stardust trail
  () => {
    FX.start(3500);
    const W = FX.W, H = FX.H;
    const dom = domLayer(3000);
    const aurora = document.createElement("div");
    aurora.style.cssText = `position:absolute;left:-30%;top:25%;width:160%;height:160px;background:linear-gradient(90deg,transparent,#C96442,#D97757,#B5882B,#5A8A3A,#4A6FA5,#7B5BA8,#B8466B,transparent);filter:blur(40px);opacity:0.7;transform:skewY(-8deg) translateX(-100%);transition:transform 2.5s cubic-bezier(0.45,0.05,0.55,0.95)`;
    dom.appendChild(aurora);
    requestAnimationFrame(() => aurora.style.transform = "skewY(-8deg) translateX(60%)");
    // sparkle trail following aurora
    for (let i = 0; i < 60; i++) {
      setTimeout(() => {
        const progress = i / 60;
        const x = -W * 0.3 + progress * W * 1.6;
        const y = H * 0.32 + (Math.random() - 0.5) * 120;
        FX.spawn({
          x, y, life: 1.2, size: 2 + Math.random() * 4,
          color: PALETTE[i % PALETTE.length], shape: "star", points: 4,
          vrot: 6, vy: -20 - Math.random() * 30,
        });
      }, i * 35);
    }
  },

  // 20: SHREDDED FINALE — full cinematic
  () => {
    FX.start(7000);
    const W = FX.W, H = FX.H;
    flash("rgba(255,255,255,0.6)", 600);
    shake(8, 700);
    // Letter reveal
    const dom = domLayer(7000);
    const text = "SHREDDED";
    const titleEl = document.createElement("div");
    titleEl.style.cssText = `position:absolute;left:50%;top:35%;transform:translate(-50%,-50%);display:flex;gap:8px;font-size:64px;font-weight:900;letter-spacing:6px;color:transparent;background:linear-gradient(180deg, #FFD700, #C96442);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 20px rgba(255,215,0,0.6))`;
    text.split("").forEach((ch, i) => {
      const s = document.createElement("span");
      s.textContent = ch;
      s.style.cssText = `display:inline-block;opacity:0;transform:translateY(40px) scale(0.5);transition:all 0.5s cubic-bezier(0.34,1.56,0.64,1)`;
      titleEl.appendChild(s);
      setTimeout(() => { s.style.opacity = "1"; s.style.transform = "none"; }, 300 + i * 100);
    });
    dom.appendChild(titleEl);
    // Side cannons
    setTimeout(() => firework(W * 0.15, H * 0.4, { n: 100, colors: GOLD }), 1200);
    setTimeout(() => firework(W * 0.85, H * 0.4, { n: 100, colors: GOLD }), 1400);
    setTimeout(() => firework(W * 0.5, H * 0.5, { n: 140, colors: PALETTE }), 1700);
    setTimeout(() => firework(W * 0.3, H * 0.3, { n: 80, colors: ["#FF6B9D", "#C44569"] }), 2200);
    setTimeout(() => firework(W * 0.7, H * 0.3, { n: 80, colors: ["#FF6B9D", "#C44569"] }), 2400);
    // raining gold confetti
    setTimeout(() => {
      for (let i = 0; i < 200; i++) {
        setTimeout(() => {
          FX.spawn({
            x: Math.random() * W, y: -20,
            vx: (Math.random() - 0.5) * 100, vy: 100 + Math.random() * 150,
            gravity: 200, drag: 0.01, life: 4,
            size: 6 + Math.random() * 4,
            color: GOLD[i % GOLD.length], shape: "rect",
            vrot: (Math.random() - 0.5) * 12,
            composite: "source-over",
          });
        }, i * 15);
      }
    }, 2500);
    // orbiting trophies (DOM)
    setTimeout(() => {
      const cx = W / 2, cy = H * 0.5;
      for (let i = 0; i < 6; i++) {
        const tEl = document.createElement("div");
        tEl.textContent = "🏆";
        tEl.style.cssText = `position:absolute;left:${cx}px;top:${cy}px;font-size:48px;will-change:transform`;
        dom.appendChild(tEl);
        const a0 = (i / 6) * Math.PI * 2;
        const t0 = performance.now();
        function orbit(t) {
          const e = (t - t0) / 1000;
          if (e > 3) return;
          const r = 120 + e * 40;
          const ang = a0 + e * Math.PI * 2;
          tEl.style.transform = `translate(${Math.cos(ang) * r - 24}px, ${Math.sin(ang) * r - 24}px) rotate(${ang}rad)`;
          tEl.style.opacity = String(1 - e / 3);
          requestAnimationFrame(orbit);
        }
        requestAnimationFrame(orbit);
      }
    }, 1500);
  },
];

const SURPRISE_NAMES = [
  "Day 1 — Liftoff", "Day 2 — Stoking the fire", "Day 3 — Star shower", "Day 4 — Heart in it",
  "Day 5 — Cha-ching", "Day 6 — Lightning", "Day 7 — Week one ✨", "Day 8 — Trophy preview",
  "Day 9 — Fireworks", "Day 10 — HALFWAY 🎯", "Day 11 — Bloom", "Day 12 — Rocket fuel",
  "Day 13 — Disco mode", "Day 14 — Beast", "Day 15 — Shooting stars", "Day 16 — Pixel rain",
  "Day 17 — Star pulse", "Day 18 — Almost", "Day 19 — Rainbow", "Day 20 — SHREDDED 🏆",
];

function runSurprise(dayNum) {
  const idx = Math.max(0, Math.min(SURPRISES.length - 1, dayNum - 1));
  try { SURPRISES[idx](); } catch (e) { console.warn("Surprise failed:", e); }
  toast(SURPRISE_NAMES[idx]);
}

function flashSave(ok) {
  const el = document.getElementById("save-status");
  if (!el) return;
  el.textContent = ok ? "Saved" : "Save failed";
  el.style.color = ok ? "var(--green)" : "var(--accent)";
  el.style.opacity = "1";
  setTimeout(() => { el.style.opacity = "0"; }, 1600);
}

// ─── ACTIONS ───
window.doLog = () => {
  const input = document.getElementById("defInput");
  const dateInput = document.getElementById("dateInput");
  const notesInput = document.getElementById("notesInput");
  if (!input) return;
  const value = parseInt(input.value);
  if (isNaN(value)) { input.focus(); return; }

  const date = dateInput ? dateInput.value : new Date().toISOString().slice(0, 10);
  if (state.logs.some(l => l.date === date)) {
    toast("Already logged " + date);
    return;
  }

  state.logs.push({ deficit: value, date, notes: notesInput ? notesInput.value : "" });
  state.logs.sort((a, b) => a.date.localeCompare(b.date));
  state.logs.forEach((l, i) => l.day = i + 1);

  const ok = save();
  const dayNum = state.logs.find(l => l.date === date)?.day || state.logs.length;
  render();
  flashSave(ok);
  runSurprise(dayNum);
};

window.deleteLog = date => {
  if (!confirm("Delete entry for " + date + "?")) return;
  state.logs = state.logs.filter(l => l.date !== date);
  state.logs.forEach((l, i) => l.day = i + 1);
  save(); render();
};

window.doReset = () => {
  if (confirm("Reset ALL data? This cannot be undone.")) {
    state.logs = [];
    localStorage.removeItem("shred20");
    idbSave({ logs: [] });
    render();
    toast("Reset");
  }
};

window.replaySurprise = (n) => runSurprise(n);
window.exportData = exportData;
window.importData = importData;

// ─── RENDER ───
function ringSVG(pct, color) {
  const r = 23, c = 2 * Math.PI * r;
  const off = c * (1 - Math.min(1, pct / 100));
  return `<svg width="56" height="56">
    <circle cx="28" cy="28" r="${r}" stroke="#E8E5DC" stroke-width="5" fill="none"/>
    <circle cx="28" cy="28" r="${r}" stroke="${color}" stroke-width="5" fill="none"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      style="transition: stroke-dashoffset 0.9s cubic-bezier(0.22,1,0.36,1)"/>
  </svg>`;
}

function render() {
  const td = state.logs.reduce((s, l) => s + l.deficit, 0);
  const daysLogged = state.logs.length;
  const daysLeft = Math.max(0, CONFIG.totalDays - daysLogged);
  const pct = (td / CONFIG.totalDeficit) * 100;
  const pctClamped = Math.min(100, Math.max(0, pct));
  const overshoot = Math.max(0, pct - 100);
  const remaining = Math.max(0, CONFIG.totalDeficit - td);
  const dailyNeeded = daysLeft > 0 ? Math.round(remaining / daysLeft) : 0;
  const expected = daysLogged * CONFIG.dailyTarget;
  const diff = td - expected;
  const ahead = diff >= 0;
  const dayPct = (daysLogged / CONFIG.totalDays) * 100;
  const lbsLost = (td / 3500).toFixed(1);
  const avgPerDay = daysLogged > 0 ? td / daysLogged : 0;
  const projectedTotal = Math.round(avgPerDay * CONFIG.totalDays);
  const projectedLbs = (projectedTotal / 3500).toFixed(1);

  const app = document.getElementById("app");
  let h = "";

  // Hero
  h += `<div class="hero">
    <div class="kicker"><span class="pulse-dot"></span>20 Day Challenge</div>
    <h1>Shred <span class="accent-text">20</span></h1>
    <div class="sub">21,000 cal deficit · ~${CONFIG.dailyTarget}/day</div>
  </div>`;

  // Progress card with lbs headline
  h += `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
      <div>
        <div class="label" style="margin-bottom:4px">Lbs lost (est.)</div>
        <div class="lbs-headline">${lbsLost}<span style="font-size:18px;color:var(--dim);font-weight:600;margin-left:4px">lbs</span></div>
      </div>
      <div style="text-align:right">
        <div class="label" style="margin-bottom:4px">Deficit</div>
        <div class="mono" style="font-size:18px;font-weight:700">${td.toLocaleString()}</div>
        <div style="font-size:11px;color:var(--dim);margin-top:2px">of ${CONFIG.totalDeficit.toLocaleString()}</div>
      </div>
    </div>
    <div class="progress-shell">
      <div class="progress-fill" style="width:${pctClamped}%"></div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--dim);font-weight:500">
      <span>${pct.toFixed(1)}%</span>
      ${overshoot > 0 ? `<span style="color:var(--gold);font-weight:700">+${overshoot.toFixed(0)}% stretch</span>` : `<span>${remaining.toLocaleString()} cal to go</span>`}
    </div>
  </div>`;

  // Metrics
  const aheadColor = ahead ? "var(--green)" : "var(--accent)";
  h += `<div class="metric-grid">
    <div class="card" style="display:flex;align-items:center;gap:14px;padding:16px">
      <div class="ring">${ringSVG(dayPct, "#C96442")}<div class="ring-text mono">${daysLogged}/${CONFIG.totalDays}</div></div>
      <div>
        <div class="label" style="margin-bottom:2px">Days</div>
        <div style="font-size:18px;font-weight:700">${daysLeft} <span style="font-size:13px;color:var(--dim);font-weight:500">left</span></div>
      </div>
    </div>
    <div class="card" style="padding:16px">
      <div class="label">Daily Target</div>
      <div class="mono" style="font-size:26px;font-weight:700;line-height:1">${dailyNeeded}<span style="font-size:13px;color:var(--dim);font-weight:500;margin-left:4px">cal</span></div>
      <div style="font-size:12px;color:${aheadColor};margin-top:6px;font-weight:600">${ahead ? '↑' : '↓'} ${Math.abs(diff).toLocaleString()} ${ahead ? 'ahead' : 'behind'}</div>
    </div>
  </div>`;

  // Projection
  if (daysLogged > 0 && daysLeft > 0) {
    h += `<div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px">
      <div>
        <div class="label" style="margin-bottom:2px">At Current Pace</div>
        <div style="font-size:12px;color:var(--dim);font-weight:500">avg ${Math.round(avgPerDay).toLocaleString()} cal/day</div>
      </div>
      <div style="text-align:right">
        <div class="mono" style="font-size:18px;font-weight:700">${projectedTotal.toLocaleString()}</div>
        <div style="font-size:11px;color:var(--purple);font-weight:600">~${projectedLbs} lbs by day 20</div>
      </div>
    </div>`;
  }

  // Log form
  const today = new Date().toISOString().slice(0, 10);
  const nextDay = Math.min(daysLogged + 1, CONFIG.totalDays);
  h += `<div class="card" style="padding:22px;background:var(--card2)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:13px;font-weight:700;color:var(--accent);letter-spacing:1px">LOG DAY ${nextDay}</div>
      <div style="font-size:11px;color:var(--mu);font-weight:600">${today}</div>
    </div>
    <div style="margin-bottom:12px">
      <div class="label">Net Deficit (cal)</div>
      <input type="number" id="defInput" placeholder="${CONFIG.dailyTarget}" autofocus>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
      <div>
        <div class="label">Date</div>
        <input type="date" id="dateInput" value="${today}">
      </div>
      <div>
        <div class="label">Notes</div>
        <input type="text" id="notesInput" placeholder="optional">
      </div>
    </div>
    <button class="cta" onclick="doLog()">Log it</button>
  </div>`;

  // Log list
  if (state.logs.length > 0) {
    h += `<div style="display:flex;justify-content:space-between;align-items:center;margin:18px 4px 8px">
      <div class="label" style="margin-bottom:0">Entries (${state.logs.length})</div>
      <div class="mono" style="font-size:11px;color:var(--mu)">avg ${Math.round(td / state.logs.length).toLocaleString()}/day</div>
    </div>`;
    state.logs.slice().reverse().forEach(l => {
      const positive = l.deficit >= 0;
      const sign = positive ? "−" : "+";
      const valColor = positive ? (l.deficit >= 1500 ? "var(--green)" : "var(--tx)") : "var(--accent)";
      const accentBar = !positive ? "var(--accent)" : l.deficit >= 1500 ? "var(--green)" : l.deficit >= CONFIG.dailyTarget ? "var(--accent2)" : "var(--gold)";
      h += `<div class="log-entry" style="border-left:3px solid ${accentBar}">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:baseline;gap:8px">
            <span style="font-weight:700;font-size:14px">Day ${l.day}</span>
            <span class="mono" style="font-size:11px;color:var(--mu)">${l.date}</span>
            <button onclick="replaySurprise(${l.day})" title="Replay surprise" style="background:transparent;border:none;color:var(--mu);font-size:13px;padding:0;cursor:pointer">✨</button>
          </div>
          ${l.notes ? `<div style="font-size:12px;color:var(--dim);margin-top:2px">${l.notes}</div>` : ""}
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="mono" style="font-weight:700;font-size:16px;color:${valColor}">${sign} ${Math.abs(l.deficit).toLocaleString()}</div>
          <button onclick="deleteLog('${l.date}')" style="background:transparent;border:1px solid var(--bd);border-radius:6px;color:var(--mu);font-size:11px;padding:3px 7px">✕</button>
        </div>
      </div>`;
    });
  } else {
    h += `<div class="card" style="text-align:center;padding:30px 20px;border:1px dashed var(--bd2);background:transparent">
      <div style="font-size:36px;margin-bottom:8px">🎯</div>
      <div style="font-size:15px;font-weight:700;margin-bottom:6px">Day 1 awaits</div>
      <div style="font-size:13px;color:var(--dim);line-height:1.6">Log your first deficit. ~${CONFIG.dailyTarget} cal/day for 20 days.<br>Each day brings a new surprise.</div>
    </div>`;
  }

  // Done
  if (td >= CONFIG.totalDeficit) {
    h += `<div class="card" style="text-align:center;padding:28px;background:var(--accent-soft);border-color:var(--accent2)">
      <div style="font-size:48px">🏆</div>
      <div style="font-size:22px;font-weight:800;color:var(--accent);margin-top:6px">Shredded.</div>
      <div style="font-size:13px;color:var(--dim);margin-top:4px">21,000 cal cleared. ${lbsLost} lbs lost.</div>
    </div>`;
  }

  // Data
  h += `<div class="card" style="margin-top:18px">
    <div class="label">Data</div>
    <div class="data-row">
      <button onclick="exportData()">Export</button>
      <button onclick="importData()">Import</button>
    </div>
    <div style="margin-top:8px">
      <button onclick="doReset()" style="width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--mu);font-size:11px;font-weight:600;letter-spacing:0.5px">Reset all</button>
    </div>
  </div>`;

  h += `<div id="save-status" class="save-flash" style="opacity:0">​</div>`;
  h += `<div style="text-align:center;padding:8px 0;font-size:10px;color:var(--mu);font-weight:500;letter-spacing:1.5px">SHRED 20</div>`;

  app.innerHTML = h;
}

(async () => { await load(); render(); })();
</script>
</body>
</html>
