<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F5F4ED">
<title>Shred 60</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #F5F4ED;
    --card: #FFFFFF;
    --card2: #FAF9F4;
    --tx: #1F1F1E;
    --tx2: #2C2C2A;
    --dim: #6B6B68;
    --mu: #9A9A95;
    --bd: #E8E5DC;
    --bd2: #D9D5C8;
    --accent: #C96442;
    --accent2: #D97757;
    --accent-soft: #F4E5DC;
    --green: #5A8A3A;
    --green-soft: #E5EFD8;
    --gold: #B5882B;
    --rose: #B8466B;
    --blue: #4A6FA5;
    --purple: #7B5BA8;
  }
  html, body { overscroll-behavior-y: contain; }
  body {
    background: var(--bg); color: var(--tx);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100vh; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 20px 18px 40px; }

  .card {
    background: var(--card); border-radius: 14px; padding: 20px; margin-bottom: 12px;
    border: 1px solid var(--bd);
    animation: rise 0.45s cubic-bezier(0.22,1,0.36,1) both;
  }
  @keyframes rise { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }

  .label { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; color: var(--mu); margin-bottom: 8px; text-transform: uppercase; }

  input[type="number"], input[type="text"], input[type="date"] {
    width: 100%; border: 1px solid var(--bd); border-radius: 10px; background: var(--bg);
    color: var(--tx); font-family: 'JetBrains Mono', monospace; box-sizing: border-box;
    transition: border-color 0.18s, box-shadow 0.18s;
  }
  input[type="number"] { padding: 16px; font-size: 26px; font-weight: 700; text-align: center; }
  input[type="text"]   { padding: 12px 14px; font-size: 15px; font-family: 'Inter', sans-serif; }
  input[type="date"]   { padding: 12px 14px; font-size: 15px; font-family: 'Inter', sans-serif; }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(201,100,66,0.15); }
  ::placeholder { color: var(--mu); }

  button { font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.15s; border: none; }
  button:active { transform: scale(0.97); }

  .cta {
    width: 100%; padding: 15px; border-radius: 12px; color: #fff; font-weight: 600; font-size: 16px;
    background: var(--accent);
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .cta:hover { background: var(--accent2); box-shadow: 0 2px 8px rgba(201,100,66,0.25); }

  .progress-shell {
    background: var(--bg); border-radius: 999px; height: 10px; overflow: hidden; position: relative;
    border: 1px solid var(--bd);
  }
  .progress-fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 1s cubic-bezier(0.22,1,0.36,1);
  }

  .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }

  .ring { position: relative; width: 56px; height: 56px; flex-shrink: 0; }
  .ring svg { transform: rotate(-90deg); }
  .ring-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--tx); }

  .log-entry {
    display: flex; justify-content: space-between; align-items: center; padding: 12px 14px;
    background: var(--card); border-radius: 12px; margin-bottom: 6px;
    border: 1px solid var(--bd); transition: all 0.15s;
    animation: rise 0.3s cubic-bezier(0.22,1,0.36,1) both;
  }
  .log-entry:hover { border-color: var(--bd2); transform: translateX(2px); }

  .data-row { display: flex; gap: 8px; }
  .data-row button {
    flex: 1; padding: 10px; border: 1px solid var(--bd); border-radius: 10px;
    background: var(--card); color: var(--dim); font-size: 12px; font-weight: 600;
  }
  .data-row button:hover { color: var(--tx); border-color: var(--bd2); background: var(--bg); }

  .save-flash { text-align: center; padding: 6px; font-size: 11px; font-weight: 600; color: var(--green); transition: opacity 0.3s; }

  /* Toggle chips */
  .chip {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 12px 8px; border-radius: 10px; border: 1px solid var(--bd);
    background: var(--bg); color: var(--dim); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.18s; user-select: none;
  }
  .chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .chip.on .chip-dot { background: var(--accent); }
  .chip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bd2); transition: background 0.18s; }

  /* Exercise inputs */
  .ex-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .ex-cell { text-align: center; }
  .ex-cell input[type="number"] { padding: 10px 4px; font-size: 18px; }
  .ex-cell .ex-name { font-size: 11px; font-weight: 700; color: var(--dim); margin-bottom: 4px; }
  .ex-cell .ex-target { font-size: 10px; color: var(--mu); margin-top: 3px; }

  /* Calendar */
  .cal-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
  .cal-cell {
    aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--bd);
    background: var(--bg); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px; position: relative;
    transition: transform 0.12s;
  }
  .cal-cell:hover { transform: scale(1.12); z-index: 2; }
  .cal-cell .cal-num { font-size: 10px; font-weight: 700; color: var(--mu); line-height: 1; }
  .cal-cell.hit { background: var(--accent-soft); border-color: var(--accent2); }
  .cal-cell.hit .cal-num { color: var(--accent); }
  .cal-cell.miss { background: #F3EEE3; border-color: var(--bd2); }
  .cal-cell.big { background: var(--green-soft); border-color: var(--green); }
  .cal-cell.big .cal-num { color: var(--green); }
  .cal-dots { display: flex; gap: 2px; height: 5px; }
  .cal-dot { width: 4px; height: 4px; border-radius: 50%; }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; font-size: 11px; color: var(--dim); font-weight: 600; }
  .cal-legend span { display: inline-flex; align-items: center; gap: 5px; }

  /* Toast */
  .toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-150%);
    background: var(--tx); color: var(--bg);
    padding: 12px 20px; border-radius: 999px; font-weight: 600; font-size: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1); z-index: 200;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Surprise FX layer */
  .fx { position: fixed; inset: 0; pointer-events: none; z-index: 150; overflow: hidden; }
  .fx-flash { position: fixed; inset: 0; pointer-events: none; z-index: 140; opacity: 0; animation: flashAnim 0.6s ease-out forwards; }
  @keyframes flashAnim { 0% { opacity: 0.5; } 100% { opacity: 0; } }

  .fx span {
    position: absolute; display: block; will-change: transform, opacity;
  }

  /* Hero */
  .hero { text-align: center; padding: 16px 0 14px; }
  .hero .kicker {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600; letter-spacing: 2px; color: var(--dim);
    padding: 4px 12px; border: 1px solid var(--bd); border-radius: 999px; background: var(--card);
    text-transform: uppercase;
  }
  .hero h1 {
    font-size: 36px; font-weight: 800; margin: 12px 0 4px; letter-spacing: -1px; color: var(--tx);
  }
  .hero .accent-text { color: var(--accent); }
  .hero .sub { font-size: 14px; color: var(--dim); font-weight: 500; }

  .pulse-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 0 rgba(201,100,66,0.5); animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(201,100,66,0.4); }
    70%  { box-shadow: 0 0 0 8px rgba(201,100,66,0); }
    100% { box-shadow: 0 0 0 0 rgba(201,100,66,0); }
  }

  .lbs-headline {
    font-family: 'Inter', sans-serif; font-size: 44px; font-weight: 800; letter-spacing: -1.5px;
    color: var(--tx); line-height: 1;
  }

  /* All 20 surprise keyframes */
  @keyframes burstOut { to { transform: translate(var(--tx-d), var(--ty-d)) rotate(var(--rot)); opacity: 0; } }
  @keyframes floatUp { 0% { transform: translateY(20px); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-110vh) rotate(var(--rot,0deg)); opacity: 0; } }
  @keyframes fall { 0% { transform: translateY(-10vh) rotate(0); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
  @keyframes shootDiag { 0% { transform: translate(-10vw, -10vh) scale(0.4); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(110vw, 110vh) scale(1); opacity: 0; } }
  @keyframes pop { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.8); opacity: 0; } }
  @keyframes ripple { 0% { transform: scale(0); opacity: 0.7; } 100% { transform: scale(20); opacity: 0; } }
  @keyframes sparkle { 0% { transform: scale(0) rotate(0); opacity: 0; } 50% { transform: scale(1) rotate(180deg); opacity: 1; } 100% { transform: scale(0) rotate(360deg); opacity: 0; } }
  @keyframes spinFly { 0% { transform: scale(0.4) rotate(0); opacity: 0; } 30% { transform: scale(1.5) rotate(360deg); opacity: 1; } 100% { transform: scale(2.5) rotate(720deg); opacity: 0; } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
  @keyframes bannerSlide { 0% { transform: translate(-100vw, 0) skewX(-10deg); opacity: 0; } 30%,70% { transform: translate(0,0) skewX(-10deg); opacity: 1; } 100% { transform: translate(110vw, 0) skewX(-10deg); opacity: 0; } }
  @keyframes rocketUp { 0% { transform: translateY(20px) scale(1); opacity: 1; } 100% { transform: translateY(-120vh) scale(1.3); opacity: 0; } }
  @keyframes rainbowSweep { 0% { transform: translateX(-110%); } 100% { transform: translateX(110%); } }
  @keyframes glowPulse { 0% { transform: scale(0); opacity: 0.6; } 100% { transform: scale(8); opacity: 0; } }
  @keyframes balloonRise { 0% { transform: translateY(20px); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateY(-110vh) translateX(var(--sway, 0)); opacity: 0; } }
  @keyframes shakeScreen { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px) translateY(2px); } 50% { transform: translateX(4px) translateY(-2px); } 75% { transform: translateX(-2px) translateY(4px); } }
  @keyframes pixelTwinkle { 0%,100% { opacity: 0; transform: scale(0.5); } 50% { opacity: 1; transform: scale(1); } }
  @keyframes bounce { 0% { transform: translateY(-100vh) scale(0.5); } 60% { transform: translateY(0) scale(1.1); } 80% { transform: translateY(-30px) scale(1); } 100% { transform: translateY(0) scale(1); opacity: 0; } }
  @keyframes orbitSpin { 0% { transform: rotate(0) translateX(var(--orbit, 80px)) rotate(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: rotate(720deg) translateX(var(--orbit, 80px)) rotate(-720deg); opacity: 0; } }

  .shaking { animation: shakeScreen 0.5s ease-in-out; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<input type="file" id="importFile" accept=".json" style="display:none">
<div id="toast" class="toast"></div>

<script>
const CONFIG = {
  totalDays: 60,
  totalDeficit: 52500,
  dailyTarget: 875,
  pushupTarget: 90,
  pullupTarget: 30,
  vupTarget: 30,
};

let state = { logs: [] };

// ─── PERSISTENCE ───
const DB_NAME = "shred60", DB_STORE = "data", DB_KEY = "state";
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSave(data) {
  try {
    const db = await openDB();
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).put(data, DB_KEY);
    await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = rej; });
  } catch {}
}
async function idbLoad() {
  try {
    const db = await openDB();
    const tx = db.transaction(DB_STORE, "readonly");
    const req = tx.objectStore(DB_STORE).get(DB_KEY);
    return new Promise(res => { req.onsuccess = () => res(req.result || null); req.onerror = () => res(null); });
  } catch { return null; }
}
async function load() {
  let data = null;
  try { const raw = localStorage.getItem("shred60"); if (raw) data = JSON.parse(raw); } catch {}
  try {
    const idb = await idbLoad();
    if (idb && (!data || (idb.logs?.length || 0) >= (data.logs?.length || 0))) data = idb;
  } catch {}
  if (data) state.logs = data.logs || [];
}
function save() {
  const data = { logs: state.logs };
  let ok = false;
  try { localStorage.setItem("shred60", JSON.stringify(data)); ok = true; } catch {}
  idbSave(data).catch(() => {});
  return ok;
}

function exportData() {
  const blob = new Blob([JSON.stringify({ logs: state.logs, exportedAt: new Date().toISOString() }, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `shred60-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function importData() { document.getElementById("importFile").click(); }
document.getElementById("importFile").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    try {
      const data = JSON.parse(evt.target.result);
      if (!Array.isArray(data.logs)) { alert("Invalid backup."); return; }
      state.logs = data.logs;
      save(); render(); toast("Imported");
    } catch (err) { alert("Import failed: " + err.message); }
  };
  reader.readAsText(file);
  e.target.value = "";
});

// ─── EFFECTS ───
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2400);
}

const PALETTE = ["#C96442", "#D97757", "#B5882B", "#5A8A3A", "#4A6FA5", "#7B5BA8", "#B8466B"];
const GOLD = ["#E8B33C", "#F4C430", "#FFD700", "#C99A2E"];
const FIRE = ["#FF3B30", "#FF6B1A", "#FF9500", "#FFD43B"];
const ROSE = ["#FF6B9D", "#C44569", "#FFB3C6", "#E84D8A"];

// ─── EASING ───
const Ease = {
  outCubic:   t => 1 - Math.pow(1 - t, 3),
  outQuint:   t => 1 - Math.pow(1 - t, 5),
  inCubic:    t => t * t * t,
  inOutCubic: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outBack:    t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outElastic: t => { if (t === 0 || t === 1) return t; const c4 = (2 * Math.PI) / 3; return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1; },
};

// ─── CANVAS FX ENGINE ───
const FX = (() => {
  let canvas, ctx, W = 0, H = 0, DPR = 1;
  let particles = [];
  let running = false;
  let lastT = 0, endT = 0;

  function ensure() {
    if (canvas) return;
    canvas = document.createElement("canvas");
    canvas.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:160";
    document.body.appendChild(canvas);
    resize();
    window.addEventListener("resize", resize);
  }
  function resize() {
    if (!canvas) return;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx = canvas.getContext("2d");
    ctx.scale(DPR, DPR);
  }
  function spawn(p) {
    p.life = p.life ?? 1; p.maxLife = p.life;
    p.vx = p.vx ?? 0; p.vy = p.vy ?? 0;
    p.ax = p.ax ?? 0; p.ay = p.ay ?? 0;
    p.gravity = p.gravity ?? 0; p.drag = p.drag ?? 0;
    p.rot = p.rot ?? 0; p.vrot = p.vrot ?? 0;
    p.size = p.size ?? 4; p.color = p.color ?? "#C96442";
    p.shape = p.shape ?? "circle";
    p.alpha = p.alpha ?? 1;
    p.composite = p.composite ?? "source-over";
    p.glow = p.glow ?? 0;
    if (p.trail) p.trailPts = [];
    particles.push(p);
  }

  function drawStar(r, points = 5, inner = 0.42) {
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const ang = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
      const rr = i % 2 === 0 ? r : r * inner;
      const x = Math.cos(ang) * rr, y = Math.sin(ang) * rr;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.fill();
  }

  function drawHeart(r) {
    ctx.beginPath();
    const s = r * 0.9;
    ctx.moveTo(0, s * 0.3);
    ctx.bezierCurveTo(s, -s * 0.5, s * 1.1, -s * 1.3, 0, -s * 0.5);
    ctx.bezierCurveTo(-s * 1.1, -s * 1.3, -s, -s * 0.5, 0, s * 0.3);
    ctx.closePath();
    ctx.fill();
  }

  function drawPetal(r) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(r * 0.5, -r * 0.5, r * 0.5, -r * 1.4, 0, -r * 1.6);
    ctx.bezierCurveTo(-r * 0.5, -r * 1.4, -r * 0.5, -r * 0.5, 0, 0);
    ctx.fill();
  }

  function drawBezierTrail(pts, color, baseW, baseAlpha) {
    if (pts.length < 2) return;
    for (let i = pts.length - 1; i >= 1; i--) {
      const t = i / pts.length;
      ctx.strokeStyle = color;
      ctx.globalAlpha = baseAlpha * (1 - t);
      ctx.lineWidth = baseW * (1 - t * 0.6);
      ctx.lineCap = "round";
      ctx.beginPath();
      const p0 = pts[i - 1], p1 = pts[i];
      const mid = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 };
      ctx.moveTo(p1.x, p1.y);
      ctx.quadraticCurveTo(p1.x, p1.y, mid.x, mid.y);
      ctx.stroke();
    }
  }

  function drawParticle(p) {
    const a = Math.max(0, p.life / p.maxLife);
    ctx.globalCompositeOperation = p.composite;

    // soft glow halo
    if (p.glow > 0 && p.shape !== "ring" && p.shape !== "rect-bar") {
      ctx.globalAlpha = a * p.alpha * 0.35;
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * p.glow);
      g.addColorStop(0, p.color);
      g.addColorStop(0.5, p.color + "55");
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.glow, 0, Math.PI * 2); ctx.fill();
    }

    if (p.trail && p.trailPts.length > 1) {
      drawBezierTrail(p.trailPts, p.color, p.size * 1.3, a * 0.55);
    }

    ctx.globalAlpha = a * p.alpha;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;

    if (p.shape === "circle") {
      ctx.beginPath(); ctx.arc(0, 0, p.size, 0, Math.PI * 2); ctx.fill();
    } else if (p.shape === "rect") {
      ctx.fillRect(-p.size / 2, -p.size * 0.7, p.size, p.size * 1.4);
    } else if (p.shape === "star") {
      drawStar(p.size, p.points || 5, p.inner || 0.42);
    } else if (p.shape === "heart") {
      drawHeart(p.size);
    } else if (p.shape === "petal") {
      drawPetal(p.size);
    } else if (p.shape === "spark") {
      const speed = Math.hypot(p.vx, p.vy) || 1;
      const len = Math.min(p.size * 6, speed * 0.05 + 8);
      ctx.rotate(Math.atan2(p.vy, p.vx) - p.rot);
      const grad = ctx.createLinearGradient(-len / 2, 0, len / 2, 0);
      grad.addColorStop(0, "rgba(255,255,255,0)");
      grad.addColorStop(0.5, p.color);
      grad.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = grad;
      ctx.fillRect(-len / 2, -p.size / 2, len, p.size);
    } else if (p.shape === "ring") {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = p.lineW || 2;
      ctx.beginPath(); ctx.arc(0, 0, p.size, 0, Math.PI * 2); ctx.stroke();
    } else if (p.shape === "flame") {
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, p.size);
      grad.addColorStop(0, "#fff");
      grad.addColorStop(0.25, p.color);
      grad.addColorStop(0.7, (p.color2 || p.color) + "88");
      grad.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(0, 0, p.size, 0, Math.PI * 2); ctx.fill();
    } else if (p.shape === "coin") {
      // 3D-ish coin: ellipse with squeeze on x for rotation illusion
      const squeeze = Math.abs(Math.cos(p.spinPhase || 0));
      ctx.beginPath();
      ctx.ellipse(0, 0, p.size * Math.max(0.12, squeeze), p.size, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(0,0,0,0.18)";
      ctx.beginPath();
      ctx.ellipse(0, p.size * 0.15, p.size * Math.max(0.1, squeeze * 0.8), p.size * 0.85, 0, 0, Math.PI * 2);
      ctx.fill();
      // rim highlight
      ctx.strokeStyle = "rgba(255,255,255,0.7)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(0, 0, p.size * Math.max(0.12, squeeze), p.size, 0, 0, Math.PI * 2);
      ctx.stroke();
    } else if (p.shape === "text") {
      ctx.font = `${p.weight || 800} ${p.size}px Inter, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      if (p.stroke) {
        ctx.strokeStyle = p.stroke;
        ctx.lineWidth = p.strokeW || 3;
        ctx.strokeText(p.text, 0, 0);
      }
      ctx.fillText(p.text, 0, 0);
    } else if (p.shape === "ray") {
      // long thin gradient beam from origin
      const len = p.size;
      const grad = ctx.createLinearGradient(0, 0, len, 0);
      grad.addColorStop(0, p.color);
      grad.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, -(p.lineW || 4) / 2, len, p.lineW || 4);
    } else if (p.shape === "leaf") {
      ctx.beginPath();
      ctx.ellipse(0, 0, p.size, p.size * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  function tick(t) {
    if (!lastT) lastT = t;
    const dt = Math.min(0.04, (t - lastT) / 1000);
    lastT = t;
    ctx.clearRect(0, 0, W, H);
    particles = particles.filter(p => {
      p.life -= dt;
      if (p.life <= 0) return false;
      if (p.update) p.update(p, dt, t);
      p.vx += p.ax * dt;
      p.vy += (p.ay + p.gravity) * dt;
      const dragF = Math.pow(1 - p.drag, dt * 60);
      p.vx *= dragF; p.vy *= dragF;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vrot * dt;
      if (p.trail) {
        p.trailPts.unshift({ x: p.x, y: p.y });
        if (p.trailPts.length > (p.trailMax || 10)) p.trailPts.pop();
      }
      drawParticle(p);
      return true;
    });
    if (particles.length || t < endT) requestAnimationFrame(tick);
    else running = false;
  }
  function start(durationMs = 1500) {
    ensure();
    endT = performance.now() + durationMs;
    if (!running) { running = true; lastT = 0; requestAnimationFrame(tick); }
  }
  return { spawn, start, ensure, get W() { return W; }, get H() { return H; } };
})();

// ─── ATMOSPHERE & FLASHES ───
function flash(color = "rgba(255,255,255,0.7)", duration = 450) {
  const el = document.createElement("div");
  el.style.cssText = `position:fixed;inset:0;background:${color};pointer-events:none;z-index:155;opacity:1;transition:opacity ${duration}ms cubic-bezier(0.22,1,0.36,1)`;
  document.body.appendChild(el);
  requestAnimationFrame(() => { el.style.opacity = "0"; });
  setTimeout(() => el.remove(), duration + 100);
}

function ambient(color, opacity = 0.3, fadeIn = 400, hold = 1500, fadeOut = 600) {
  const el = document.createElement("div");
  el.style.cssText = `position:fixed;inset:0;background:${color};pointer-events:none;z-index:148;opacity:0;transition:opacity ${fadeIn}ms ease-out`;
  document.body.appendChild(el);
  requestAnimationFrame(() => { el.style.opacity = String(opacity); });
  setTimeout(() => {
    el.style.transition = `opacity ${fadeOut}ms ease-in`;
    el.style.opacity = "0";
  }, fadeIn + hold);
  setTimeout(() => el.remove(), fadeIn + hold + fadeOut + 50);
}

function vignette(opacity = 0.4, duration = 2000) {
  const el = document.createElement("div");
  el.style.cssText = `position:fixed;inset:0;background:radial-gradient(circle at 50% 40%, transparent 30%, rgba(0,0,0,${opacity}) 100%);pointer-events:none;z-index:149;opacity:0;transition:opacity 600ms ease-out`;
  document.body.appendChild(el);
  requestAnimationFrame(() => { el.style.opacity = "1"; });
  setTimeout(() => {
    el.style.transition = "opacity 800ms ease-in";
    el.style.opacity = "0";
  }, duration);
  setTimeout(() => el.remove(), duration + 900);
}

function shake(intensity = 8, duration = 500) {
  const target = document.getElementById("app");
  const t0 = performance.now();
  function step(t) {
    const e = (t - t0) / duration;
    if (e >= 1) { target.style.transform = ""; return; }
    const decay = (1 - e) * (1 - e);
    const x = (Math.random() - 0.5) * 2 * intensity * decay;
    const y = (Math.random() - 0.5) * 2 * intensity * decay;
    target.style.transform = `translate(${x}px, ${y}px)`;
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function domLayer(durationMs = 2500) {
  const c = document.createElement("div");
  c.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:170;overflow:hidden";
  document.body.appendChild(c);
  setTimeout(() => c.remove(), durationMs + 200);
  return c;
}

// Procedural fractal lightning bolt
function lightningBolt(x1, y1, x2, y2, displace, segs) {
  if (displace < 4) {
    segs.push([x1, y1, x2, y2]);
    return;
  }
  const mx = (x1 + x2) / 2 + (Math.random() - 0.5) * displace;
  const my = (y1 + y2) / 2 + (Math.random() - 0.5) * displace;
  lightningBolt(x1, y1, mx, my, displace / 2, segs);
  lightningBolt(mx, my, x2, y2, displace / 2, segs);
  if (Math.random() < 0.3 && displace > 18) {
    const bx = mx + (Math.random() - 0.5) * displace * 1.4;
    const by = my + Math.random() * displace * 0.7;
    lightningBolt(mx, my, bx, by, displace / 3, segs);
  }
}

    const ARMS = 3;
    for (let i = 0; i < 140; i++) {
      const arm = i % ARMS;
      const frac = (i / 140);
      const baseAng = (arm / ARMS) * Math.PI * 2 + frac * 4.2;
      const dist = 20 + frac * 220;
      FX.spawn({
        x: cx, y: cy, life: 2.6 + Math.random() * 0.8,

        update: (p) => {
          const e = (p.maxLife - p.life) / p.maxLife;
          const spin = baseAng + e * 2.2;
          const r = dist * Math.min(1, e * 2.5);
          p.x = cx + Math.cos(spin) * r;
          p.y = cy + Math.sin(spin) * r * 0.55;
          p.alpha = Math.sin(Math.min(1, e * 1.2) * Math.PI);

// Scene names (index-aligned with SURPRISES)
const SCENE_NAMES = [
  "Liftoff", "Stoking the fire", "Comet shower", "Heart resonance", "Coin cascade",
  "Lightning", "Sparkle storm", "Trophy ascension", "Mortar barrage", "HALFWAY 🎯",
  "Bloom garden", "Rocket fuel", "Disco", "Beast mode", "Shooting stars",
  "Pixel rain", "Star pulse", "Balloons", "Aurora", "SHREDDED 🏆",
  "Phoenix", "Galaxy", "Tidal wave", "Crystal frost", "Meteor impact",
  "DNA ascension", "Volcano", "Portal", "Stormfront", "Supernova",
];

// Pinned milestones; every other day picks a random scene (seeded by the
// entry's date so replays show the same scene). Finale (19) and HALFWAY (9)
// are excluded from the random pool.
const PINNED = { 30: 9, 60: 19 };
const RANDOM_POOL = SCENE_NAMES.map((_, i) => i).filter(i => i !== 9 && i !== 19);

function seededIndex(str, mod) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return Math.abs(h) % mod;
}

function sceneForDay(dayNum, dateStr) {
  if (PINNED[dayNum] !== undefined) return PINNED[dayNum];
  return RANDOM_POOL[seededIndex(dateStr || String(dayNum), RANDOM_POOL.length)];
}

function runSurprise(dayNum, dateStr) {
  const idx = sceneForDay(dayNum, dateStr);
  try { SURPRISES[idx](); } catch (e) { console.warn("Surprise failed:", e); }
  toast(`Day ${dayNum} — ${SCENE_NAMES[idx]}`);
}

function flashSave(ok) {
  const el = document.getElementById("save-status");
  if (!el) return;
  el.textContent = ok ? "Saved" : "Save failed";
  el.style.color = ok ? "var(--green)" : "var(--accent)";
  el.style.opacity = "1";
  setTimeout(() => { el.style.opacity = "0"; }, 1600);
}

// Form toggle state (reset after each log)
let formToggles = { drank: false, gym: false };

window.toggleChip = (key) => {
  formToggles[key] = !formToggles[key];
  const el = document.getElementById("chip-" + key);
  if (el) el.classList.toggle("on", formToggles[key]);
};

window.doLog = () => {
  const input = document.getElementById("defInput");
  const dateInput = document.getElementById("dateInput");
  const notesInput = document.getElementById("notesInput");
  if (!input) return;
  const value = parseInt(input.value);
  if (isNaN(value)) { input.focus(); return; }

  const date = dateInput ? dateInput.value : new Date().toISOString().slice(0, 10);
  if (state.logs.some(l => l.date === date)) {
    toast("Already logged " + date);
    return;
  }

  const num = id => {
    const el = document.getElementById(id);
    const v = el ? parseInt(el.value) : NaN;
    return isNaN(v) ? 0 : Math.max(0, v);
  };

  state.logs.push({
    deficit: value, date,
    notes: notesInput ? notesInput.value : "",
    drank: formToggles.drank,
    gym: formToggles.gym,
    pushups: num("pushupInput"),
    pullups: num("pullupInput"),
    vups: num("vupInput"),
  });
  state.logs.sort((a, b) => a.date.localeCompare(b.date));
  state.logs.forEach((l, i) => l.day = i + 1);

  formToggles = { drank: false, gym: false };
  const ok = save();
  const dayNum = state.logs.find(l => l.date === date)?.day || state.logs.length;
  render();
  flashSave(ok);
  runSurprise(dayNum, date);
};

window.deleteLog = date => {
  if (!confirm("Delete entry for " + date + "?")) return;
  state.logs = state.logs.filter(l => l.date !== date);
  state.logs.forEach((l, i) => l.day = i + 1);
  save(); render();
};

window.doReset = () => {
  if (confirm("Reset ALL data? This cannot be undone.")) {
    state.logs = [];
    localStorage.removeItem("shred60");
    idbSave({ logs: [] });
    render();
    toast("Reset");
  }
};

window.replaySurprise = (n, dateStr) => runSurprise(n, dateStr);
window.exportData = exportData;
window.importData = importData;

function ringSVG(pct, color) {
  const r = 23, c = 2 * Math.PI * r;
  const off = c * (1 - Math.min(1, pct / 100));
  return `<svg width="56" height="56">
    <circle cx="28" cy="28" r="${r}" stroke="#E8E5DC" stroke-width="5" fill="none"/>
    <circle cx="28" cy="28" r="${r}" stroke="${color}" stroke-width="5" fill="none"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      style="transition: stroke-dashoffset 0.9s cubic-bezier(0.22,1,0.36,1)"/>
  </svg>`;
}

      const valColor = positive ? (l.deficit >= 1500 ? "var(--green)" : "var(--tx)") : "var(--accent)";
      const accentBar = !positive ? "var(--accent)" : l.deficit >= 1500 ? "var(--green)" : l.deficit >= CONFIG.dailyTarget ? "var(--accent2)" : "var(--gold)";
      h += `<div class="log-entry" style="border-left:3px solid ${accentBar}">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:baseline;gap:8px">
            <span style="font-weight:700;font-size:14px">Day ${l.day}</span>
            <span class="mono" style="font-size:11px;color:var(--mu)">${l.date}</span>
            <button onclick="replaySurprise(${l.day}, '${l.date}')" title="Replay surprise" style="background:transparent;border:none;color:var(--mu);font-size:13px;padding:0;cursor:pointer">✨</button>
          </div>
          <div style="display:flex;gap:6px;margin-top:3px;font-size:11px;font-weight:600;flex-wrap:wrap">
            ${l.gym ? `<span style="color:var(--green)">🏋️ gym</span>` : ""}
            ${l.drank ? `<span style="color:var(--purple)">🍺</span>` : ""}
            ${(l.pushups || 0) > 0 ? `<span style="color:${l.pushups >= CONFIG.pushupTarget ? "var(--green)" : "var(--mu)"}">↗${l.pushups} push</span>` : ""}
            ${(l.pullups || 0) > 0 ? `<span style="color:${l.pullups >= CONFIG.pullupTarget ? "var(--green)" : "var(--mu)"}">↑${l.pullups} pull</span>` : ""}
            ${(l.vups || 0) > 0 ? `<span style="color:${l.vups >= CONFIG.vupTarget ? "var(--green)" : "var(--mu)"}">∨${l.vups} v-up</span>` : ""}
          </div>
          ${l.notes ? `<div style="font-size:12px;color:var(--dim);margin-top:2px">${l.notes}</div>` : ""}
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="mono" style="font-weight:700;font-size:16px;color:${valColor}">${sign} ${Math.abs(l.deficit).toLocaleString()}</div>
          <button onclick="deleteLog('${l.date}')" style="background:transparent;border:1px solid var(--bd);border-radius:6px;color:var(--mu);font-size:11px;padding:3px 7px">✕</button>
        </div>
      </div>`;
    });
  } else {
    h += `<div class="card" style="text-align:center;padding:30px 20px;border:1px dashed var(--bd2);background:transparent">
      <div style="font-size:36px;margin-bottom:8px">🎯</div>
      <div style="font-size:15px;font-weight:700;margin-bottom:6px">Day 1 awaits</div>
      <div style="font-size:13px;color:var(--dim);line-height:1.6">Log your first deficit. ~${CONFIG.dailyTarget} cal/day for 60 days.<br>Each day brings a new surprise.</div>
    </div>`;
  }

  // Done
  if (td >= CONFIG.totalDeficit) {
    h += `<div class="card" style="text-align:center;padding:28px;background:var(--accent-soft);border-color:var(--accent2)">
      <div style="font-size:48px">🏆</div>
      <div style="font-size:22px;font-weight:800;color:var(--accent);margin-top:6px">Shredded.</div>
      <div style="font-size:13px;color:var(--dim);margin-top:4px">${CONFIG.totalDeficit.toLocaleString()} cal cleared. ${lbsLost} lbs lost.</div>
    </div>`;
  }

  // Data
  h += `<div class="card" style="margin-top:18px">
    <div class="label">Data</div>
    <div class="data-row">
      <button onclick="exportData()">Export</button>
      <button onclick="importData()">Import</button>
    </div>
    <div style="margin-top:8px">
      <button onclick="doReset()" style="width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--mu);font-size:11px;font-weight:600;letter-spacing:0.5px">Reset all</button>
    </div>
  </div>`;

  h += `<div id="save-status" class="save-flash" style="opacity:0">​</div>`;
  h += `<div style="text-align:center;padding:8px 0;font-size:10px;color:var(--mu);font-weight:500;letter-spacing:1.5px">SHRED 60</div>`;

  app.innerHTML = h;
}

(async () => { await load(); render(); })();
</script>
</body>
</html>
